<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班风班训 - HwaKwong</title>
    <style>
        /* === 从首页复制的完整样式 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #0B2A4A;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        nav {
            background: #f0f0f0;
            padding: 1rem;
        }
        nav ul {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
        }
        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }
        nav ul li a:hover {
            color: #0B2A4A;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        section {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
        }
        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        /* === 班风页专用样式 === */
        .style-card {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 5px solid #0B2A4A;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .motto {
            font-size: 1.8rem;
            color: #0B2A4A;
            text-align: center;
            margin: 20px 0;
            font-weight: 600;
        }
        .style-card h2 {
            color: #0B2A4A;
            margin-bottom: 1rem;
        }
        .style-card ul {
            margin-left: 20px;
            color: #555;
        }
        .style-card li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>HwaKwong School</h1>
        <p>[HG] · [2024 01] · 班风班训</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="index.photo.html">照片</a></li>
            <li><a href="index.style.html">班风</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="style-card">
            <h2>班级口号</h2>
            <p class="motto">血气方刚，锐不可挡，一班在此，斗志昂扬。</p>
        </div>

        <div class="style-card">
            <h2>班训</h2>
            <ul>
                <li>我也不确定。</li>
                <li>（等确定了再改）</li>
            </ul>
        </div>

        <div class="style-card">
            <h2>班级目标</h2>
            <p>不可捉摸。</p>
        </div>
    </div>

    <footer>
        <p>© 2026 HGS 晨曦一班 · 由班级同学维护</p>
    </footer>
</body>
</html>
